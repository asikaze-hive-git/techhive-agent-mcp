name: 接続・認証の相談 (Connection help)
description: 接続や OAuth 認証がうまくいかないときの相談
labels: ["triage", "support"]
body:
  - type: markdown
    attributes:
      value: |
        まず README の接続手順をご確認ください。**トークン・認可コード・URL のクエリ文字列は貼らないでください。**
  - type: textarea
    id: symptom
    attributes:
      label: 症状
      placeholder: 例）claude mcp add 後、ブラウザ認証で admin 権限が無いと言われる。
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: どの段階か
      placeholder: 例）DCR / 認可画面 / トークン取得 / tools/list
    validations:
      required: false
  - type: checkboxes
    id: no-secrets
    attributes:
      label: 確認
      options:
        - label: トークン・認可コード等の秘密を含めていないことを確認しました。
          required: true
