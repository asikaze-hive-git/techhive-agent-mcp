name: Secret & PII scan

# 公開 repo なので、秘密・機密の漏洩を CI で機械的に止める最終防衛線。
#   1. draft-guard: fde/draft/ 配下（.gitkeep 以外）が追跡されていたら fail
#      → 実クライアントの機密・PII が commit されるのを構造的に防ぐ
#   2. gitleaks: API キー等の秘密文字列が commit に混入していたら fail

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: draft-guard — fde/draft/ に追跡ファイルが無いこと
        run: |
          leaked=$(git ls-files 'fde/draft/**' | grep -v '^fde/draft/.gitkeep$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::fde/draft/ 配下のファイルが git 追跡されています（機密・PII 漏洩リスク）:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: fde/draft/ に追跡ファイルはありません（.gitkeep のみ）。"

      - name: secret-scan — gitleaks（秘密文字列の混入検出）
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1
